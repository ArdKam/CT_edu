name: CT Edu checks

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run unit and UI contract tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/data/anatomy.js
          node --check src/viewer/schematic-viewer.js
          node --check src/quiz/quiz-engine.js
          node --check src/app.js
      - name: Check archive inventory script syntax
        run: |
          python3 -m py_compile scripts/inspect_archives.py
          python3 -m py_compile scripts/read_atlas_metadata.py
      - name: Inventory uploaded atlas archives without extracting them
        continue-on-error: true
        run: python3 scripts/inspect_archives.py
      - name: Read license, README and NRRD header in-place
        run: python3 scripts/read_atlas_metadata.py
      - name: Set up Python for image preparation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare one-slice CT/labelmap review bundle
        run: |
          python -m pip install --disable-pip-version-check numpy pillow
          python scripts/build_demo_assets.py --output build/ct-demo-slice
      - name: Commit derived teaching-slice assets to the CT Edu feature branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')
        run: |
          if [ -f assets/spl-abdominal-demo/ct-slice.png ]; then
            echo "Teaching slice already exists; leaving it unchanged."
            exit 0
          fi
          mkdir -p assets/spl-abdominal-demo
          cp build/ct-demo-slice/ct-slice.png assets/spl-abdominal-demo/
          cp build/ct-demo-slice/label-ids-rgb.png assets/spl-abdominal-demo/
          cp build/ct-demo-slice/demo-slice.json assets/spl-abdominal-demo/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spl-abdominal-demo/
          git commit -m "data: add one-slice SPL abdomen teaching preview"
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Upload CT slice review bundle
        uses: actions/upload-artifact@v4
        with:
          name: ct-edu-demo-slice-review
          path: build/ct-demo-slice/
          if-no-files-found: error
          retention-days: 7
