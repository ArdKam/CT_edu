name: CT Edu checks

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run unit and UI contract tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/data/anatomy.js
          node --check src/viewer/schematic-viewer.js
          node --check src/quiz/quiz-engine.js
          node --check src/app.js
      - name: Check archive inventory script syntax
        run: python3 -m py_compile scripts/inspect_archives.py
      - name: Inventory uploaded atlas archives without extracting them
        continue-on-error: true
        run: python3 scripts/inspect_archives.py
