name: CT Edu checks

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Run unit and UI contract tests
        run: npm test
      - name: Validate draft guided-case template and keep publication gate closed
        run: node scripts/validate_teaching_case.js cases/templates/teaching-case.template.json
      - name: Check JavaScript syntax
        run: |
          node --check src/data/anatomy.js
          node --check src/viewer/schematic-viewer.js
          node --check src/viewer/ct-slice-viewer.js
          node --check src/viewer/tri-planar-viewer.js
          node --check src/quiz/quiz-engine.js
          node --check src/data/progress-store.js
          node --check src/data/bookmark-store.js
          node --check src/segmentor/geometry.js
          node --check src/segmentor/source-metadata.js
          node --check src/segmentor/annotation-schema.js
          node --check src/segmentor/annotation-store.js
          node --check src/segmentor/editor.js
          node --check src/data/case-manifest.js
          node --check scripts/validate_teaching_case.js
          node --check src/app.js
          node --check src/data/guided-cases.js
          node --check src/data/radiopaedia-abdominal-cases.js
          node --check src/guided-cases.js
      - name: Check archive inventory script syntax
        run: |
          python3 -m py_compile scripts/inspect_archives.py
          python3 -m py_compile scripts/read_atlas_metadata.py
      - name: Inventory uploaded atlas archives without extracting them
        continue-on-error: true
        run: python3 scripts/inspect_archives.py
      - name: Read license, README and NRRD header in-place
        run: python3 scripts/read_atlas_metadata.py
      - name: Set up Python for image preparation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare 113-slice CT/labelmap review bundle
        run: |
          python -m pip install --disable-pip-version-check numpy pillow
          python scripts/build_demo_assets.py --output build/ct-demo-volume
      - name: Validate raw CT fidelity, label alignment, and all viewing planes
        run: |
          python - <<'PY'
          import gzip
          import json
          import sys
          import zipfile
          from pathlib import Path

          import numpy as np
          from PIL import Image

          sys.path.insert(0, "scripts")
          from build_demo_assets import read_nrrd

          root = Path("build/ct-demo-volume")
          volume = json.loads((root / "volume.json").read_text(encoding="utf-8"))
          assert volume["sliceCount"] == volume["dimensions"]["slices"] == 113
          assert volume["dimensions"]["width"] == 256
          assert volume["dimensions"]["height"] == 256
          assert set(volume["planes"]) == {"axial", "coronal", "sagittal"}
          expected_counts = {"axial": 113, "coronal": 256, "sagittal": 256}
          for plane, count in expected_counts.items():
              assert volume["planes"][plane]["sliceCount"] == count

          # Prove that the compressed raw sidecar is lossless against the bundled NRRD CT.
          archives = sorted(Path(".").glob("abacktools-abdomen-2016-09-part*-of6.zip"))
          source_members = {}
          for archive in archives:
              with zipfile.ZipFile(archive) as source_zip:
                  for info in source_zip.infolist():
                      name = Path(info.filename).name.lower()
                      if name in {"i.nrrd", "seg.nrrd"} and name not in source_members:
                          source_members[name] = source_zip.read(info.filename)
          assert set(source_members) == {"i.nrrd", "seg.nrrd"}, source_members.keys()
          ct_header, source_ct = read_nrrd(source_members["i.nrrd"])
          label_header, source_labels = read_nrrd(source_members["seg.nrrd"])
          assert source_ct.shape == source_labels.shape == (113, 256, 256)
          assert ct_header.get("sizes") == label_header.get("sizes")

          raw_meta = volume["rawVoxelVolume"]
          raw_path = root / raw_meta["path"]
          assert raw_path.is_file() and raw_path.stat().st_size > 1000
          assert raw_meta["dtype"] == "int16-le"
          assert raw_meta["voxelCount"] == source_ct.size
          assert "HU calibration has not been independently verified" in raw_meta["valueSemantics"]
          with gzip.open(raw_path, "rb") as raw_file:
              raw_bytes = raw_file.read()
          assert len(raw_bytes) == source_ct.size * 2
          raw_ct = np.frombuffer(raw_bytes, dtype="<i2").reshape(source_ct.shape)
          np.testing.assert_array_equal(raw_ct, source_ct.astype("<i2"))
          assert raw_meta["intensityRange"]["min"] == int(source_ct.min())
          assert raw_meta["intensityRange"]["max"] == int(source_ct.max())

          width = float(volume["window"]["width"])
          level = float(volume["window"]["level"])
          low, high = level - width / 2, level + width / 2

          def window_to_u8(values):
              return np.clip((values.astype(np.float32) - low) / (high - low) * 255, 0, 255).astype(np.uint8)

          def decode_label_png(file_path):
              rgb = np.asarray(Image.open(file_path).convert("RGB"), dtype=np.uint16)
              return rgb[:, :, 0] + 256 * rgb[:, :, 1]

          # Test first, middle/default, and last slices in every orientation for exact CT and mask transforms.
          plane_sources = {
              "axial": (lambda i: np.flipud(source_ct[i]), lambda i: np.flipud(source_labels[i])),
              "coronal": (lambda i: source_ct[:, i, :], lambda i: source_labels[:, i, :]),
              "sagittal": (lambda i: np.flip(source_ct[:, :, i], axis=1), lambda i: np.flip(source_labels[:, :, i], axis=1)),
          }
          for plane, count in expected_counts.items():
              meta = volume["planes"][plane]
              ct_getter, label_getter = plane_sources[plane]
              for index in sorted({0, int(meta["defaultSliceIndex"]), count // 2, count - 1}):
                  suffix = f"{index:03d}"
                  ct_path = root / meta["ctPattern"].replace("{index:03d}", suffix)
                  label_path = root / meta["labelsPattern"].replace("{index:03d}", suffix)
                  expected_ct = window_to_u8(ct_getter(index))
                  actual_ct = np.asarray(Image.open(ct_path).convert("L"))
                  np.testing.assert_array_equal(actual_ct, expected_ct, err_msg=f"{plane} CT mismatch at {index}")
                  actual_labels = decode_label_png(label_path)
                  np.testing.assert_array_equal(actual_labels, label_getter(index).astype(np.uint16),
                                                err_msg=f"{plane} labelmap mismatch at {index}")

          # The selected axial preview assets must obey exactly the same transform as stack slice k=26.
          default_k = int(volume["planes"]["axial"]["defaultSliceIndex"])
          np.testing.assert_array_equal(
              np.asarray(Image.open(root / "ct-slice.png").convert("L")),
              window_to_u8(np.flipud(source_ct[default_k]))
          )
          np.testing.assert_array_equal(
              decode_label_png(root / "label-ids-rgb.png"),
              np.flipud(source_labels[default_k]).astype(np.uint16)
          )
          print(
              "Validated lossless raw CT (int16), exact CT/labelmap alignment for axial/coronal/sagittal samples, "
              f"plane counts {expected_counts}, matrix 256x256x113, spacing {volume['spacingMm']}."
          )
          PY
      - name: Install Playwright and Chromium, Firefox, and WebKit for browser smoke tests
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          node -p "'Playwright version: ' + require('./node_modules/playwright/package.json').version"
          npx playwright install --with-deps chromium firefox webkit
      - name: Stage generated orthogonal planes into the local test site
        run: cp -R build/ct-demo-volume/. assets/spl-abdominal-demo/
      - name: Run real Chromium viewer smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > build/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-smoke.cjs
          node tests/segmentor-browser-smoke.cjs
          for engine in chromium firefox webkit; do
            echo "Running cross-engine compatibility smoke: $engine"
            BROWSER_ENGINE="$engine" node tests/browser-compat.cjs
          done
      - name: Upload generated orthogonal CT review bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-edu-orthogonal-volume-review
          path: build/ct-demo-volume/
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser smoke screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-edu-browser-smoke
          path: build/browser-smoke/
          if-no-files-found: ignore
          retention-days: 7
