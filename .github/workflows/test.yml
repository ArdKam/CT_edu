name: CT Edu checks

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run unit and UI contract tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/data/anatomy.js
          node --check src/viewer/schematic-viewer.js
          node --check src/viewer/ct-slice-viewer.js
          node --check src/quiz/quiz-engine.js
          node --check src/app.js
      - name: Check archive inventory script syntax
        run: |
          python3 -m py_compile scripts/inspect_archives.py
          python3 -m py_compile scripts/read_atlas_metadata.py
      - name: Inventory uploaded atlas archives without extracting them
        continue-on-error: true
        run: python3 scripts/inspect_archives.py
      - name: Read license, README and NRRD header in-place
        run: python3 scripts/read_atlas_metadata.py
      - name: Set up Python for image preparation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare 113-slice CT/labelmap review bundle
        run: |
          python -m pip install --disable-pip-version-check numpy pillow
          python scripts/build_demo_assets.py --output build/ct-demo-volume
      - name: Validate exported axial stack and metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/ct-demo-volume")
          volume = json.loads((root / "volume.json").read_text(encoding="utf-8"))
          assert volume["sliceCount"] == volume["dimensions"]["slices"], volume
          assert volume["sliceCount"] == 113, volume["sliceCount"]
          assert volume["dimensions"]["width"] == 256
          assert volume["dimensions"]["height"] == 256
          for index in (0, 26, 112):
              suffix = f"{index:03d}.png"
              assert (root / "slices" / f"ct-{suffix}").is_file(), suffix
              assert (root / "slices" / f"labels-{suffix}").is_file(), suffix
          print(f"Validated {volume['sliceCount']} aligned CT/labelmap slices; matrix {volume['dimensions']['width']}x{volume['dimensions']['height']}; spacing {volume['spacingMm']}")
          PY
      - name: Upload CT volume review bundle
        uses: actions/upload-artifact@v4
        with:
          name: ct-edu-axial-volume-review
          path: build/ct-demo-volume/
          if-no-files-found: error
          retention-days: 7
