name: CT Edu checks

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run unit and UI contract tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/data/anatomy.js
          node --check src/viewer/schematic-viewer.js
          node --check src/viewer/ct-slice-viewer.js
          node --check src/quiz/quiz-engine.js
          node --check src/app.js
      - name: Check archive inventory script syntax
        run: |
          python3 -m py_compile scripts/inspect_archives.py
          python3 -m py_compile scripts/read_atlas_metadata.py
      - name: Inventory uploaded atlas archives without extracting them
        continue-on-error: true
        run: python3 scripts/inspect_archives.py
      - name: Read license, README and NRRD header in-place
        run: python3 scripts/read_atlas_metadata.py
      - name: Set up Python for image preparation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare 113-slice CT/labelmap review bundle
        run: |
          python -m pip install --disable-pip-version-check numpy pillow
          python scripts/build_demo_assets.py --output build/ct-demo-volume
      - name: Validate raw intensity data and all CT viewing planes
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          root = Path("build/ct-demo-volume")
          volume = json.loads((root / "volume.json").read_text(encoding="utf-8"))
          assert volume["sliceCount"] == volume["dimensions"]["slices"], volume
          assert volume["sliceCount"] == 113, volume["sliceCount"]
          assert volume["dimensions"]["width"] == 256
          assert volume["dimensions"]["height"] == 256
          raw_meta = volume["rawVoxelVolume"]
          raw_path = root / raw_meta["path"]
          assert raw_path.is_file() and raw_path.stat().st_size > 1000
          assert raw_meta["voxelCount"] == 256 * 256 * 113
          with gzip.open(raw_path, "rb") as raw_file:
              raw_bytes = raw_file.read()
          assert len(raw_bytes) == raw_meta["voxelCount"] * 2
          assert raw_meta["dtype"] == "int16-le"
          assert "HU calibration has not been independently verified" in raw_meta["valueSemantics"]
          assert set(volume["planes"]) == {"axial", "coronal", "sagittal"}, volume["planes"].keys()
          expected = {"axial": 113, "coronal": 256, "sagittal": 256}
          for plane, count in expected.items():
              meta = volume["planes"][plane]
              assert meta["sliceCount"] == count, (plane, meta["sliceCount"])
              for index in sorted({0, count // 2, count - 1}):
                  suffix = f"{index:03d}"
                  assert (root / meta["ctPattern"].replace("{index:03d}", suffix)).is_file(), (plane, suffix)
                  assert (root / meta["labelsPattern"].replace("{index:03d}", suffix)).is_file(), (plane, suffix)
          print(f"Validated CT/labelmap planes {expected}; axial source matrix {volume['dimensions']['width']}x{volume['dimensions']['height']}; voxel spacing {volume['spacingMm']}")
          PY
      - name: Install Playwright and Chromium for browser smoke tests
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Stage generated orthogonal planes into the local test site
        run: cp -R build/ct-demo-volume/. assets/spl-abdominal-demo/
      - name: Run real Chromium viewer smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > build/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-smoke.cjs
      - name: Upload generated orthogonal CT review bundle
        uses: actions/upload-artifact@v4
        with:
          name: ct-edu-orthogonal-volume-review
          path: build/ct-demo-volume/
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ct-edu-browser-smoke
          path: build/browser-smoke/
          if-no-files-found: ignore
          retention-days: 7
