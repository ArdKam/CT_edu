name: Generate experimental major-organ masks

on:
  pull_request:
    types: [opened]
    branches:
      - "main"
    paths:
      - "scripts/generate_major_organ_masks.py"
      - ".github/workflows/organ-segmentation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-organ-segmentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  segment-major-organs:
    if: ${{ github.repository == 'ArdKam/CT_edu' && ((github.event_name == 'pull_request' && github.head_ref == 'codex/segmentor-three-plane-main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/segmentor-three-plane-main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade --disable-pip-version-check pip
          python -m pip install --disable-pip-version-check "numpy<2" pillow nibabel "TotalSegmentator==2.11.0"

      - name: Validate the inference runner syntax
        run: python -m py_compile scripts/generate_major_organ_masks.py scripts/build_demo_assets.py

      - name: Run TotalSegmentator for four major abdominal organs
        env:
          OMP_NUM_THREADS: "2"
          ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS: "2"
        run: |
          set -euo pipefail
          python scripts/generate_major_organ_masks.py \
            --output preview/assets/organ-predictions \
            --intensity-offset 1024 \
            --fast

      - name: Validate output masks and manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import nibabel as nib
          import numpy as np
          from PIL import Image
          root = Path("preview/assets/organ-predictions")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["schemaVersion"] == 1
          assert manifest["status"] == "experimental-unreviewed"
          assert manifest["sourceDimensionsXYZ"] == [256, 256, 113]
          assert manifest["planeDefinitions"]["axial"]["sliceCount"] == 113
          assert manifest["planeDefinitions"]["axial"]["imageSize"] == [256, 256]
          assert manifest["planeDefinitions"]["coronal"]["sliceCount"] == 256
          assert manifest["planeDefinitions"]["coronal"]["imageSize"] == [256, 113]
          assert manifest["planeDefinitions"]["sagittal"]["sliceCount"] == 256
          assert manifest["planeDefinitions"]["sagittal"]["imageSize"] == [256, 113]
          assert len(manifest["organs"]) == 4
          assert len(list(root.glob("*.png"))) == 2500
          assert len(list(root.glob("*.nii.gz"))) == 5
          assert (root / "major-organ-labelmap.nii.gz").is_file()
          assert manifest["labelMap"]["file"] == "major-organ-labelmap.nii.gz"
          assert manifest["labelMap"]["overlapVoxelCount"] >= 0
          assert len(manifest["affineRAS"]) == 4
          assert len(manifest["labelMap"]["labels"]) == 4
          assert {item["id"] for item in manifest["organs"]} == {
              "liver", "spleen", "kidney_right", "kidney_left"
          }
          for item in manifest["organs"]:
              assert item["voxels"] > 0, item["id"]
              assert len(item["nonEmptySlices"]) > 0, item["id"]
              assert item["reviewStatus"] == "unreviewed-model-output"
              assert (root / item["maskVolumeFile"]).is_file()
              assert set(item["maskPatterns"]) == {"axial", "coronal", "sagittal"}
              for plane in ("axial", "coronal", "sagittal"):
                  assert "{index:03d}" in item["maskPatterns"][plane]
                  assert (root / item["maskPatterns"][plane].replace("{index:03d}", "000")).is_file()
              assert item["volumeLabelId"] in {1, 2, 3, 4}
              mask_image = nib.load(str(root / item["maskVolumeFile"]))
              assert mask_image.shape == (256, 256, 113), item["id"]
              assert np.allclose(mask_image.affine, np.asarray(manifest["affineRAS"]), atol=1e-4), item["id"]
              mask_xyz = np.asarray(mask_image.dataobj) > 0.5
              plane_samples = {
                  "axial": (0, 26, 56, 112),
                  "coronal": (0, 127, 255),
                  "sagittal": (0, 127, 255),
              }
              for k in plane_samples["axial"]:
                  expected = np.flipud(mask_xyz[:, :, k].T)
                  filename = item["maskPatterns"]["axial"].replace("{index:03d}", f"{k:03d}")
                  actual = np.asarray(Image.open(root / filename).convert("L")) > 0
                  np.testing.assert_array_equal(actual, expected, err_msg=f'{item["id"]} axial orientation at {k}')
              for y in plane_samples["coronal"]:
                  expected = mask_xyz[:, y, :].T
                  filename = item["maskPatterns"]["coronal"].replace("{index:03d}", f"{y:03d}")
                  actual = np.asarray(Image.open(root / filename).convert("L")) > 0
                  np.testing.assert_array_equal(actual, expected, err_msg=f'{item["id"]} coronal orientation at {y}')
              for x in plane_samples["sagittal"]:
                  expected = np.fliplr(mask_xyz[x, :, :].T)
                  filename = item["maskPatterns"]["sagittal"].replace("{index:03d}", f"{x:03d}")
                  actual = np.asarray(Image.open(root / filename).convert("L")) > 0
                  np.testing.assert_array_equal(actual, expected, err_msg=f'{item["id"]} sagittal orientation at {x}')
              print(
                  "ORGAN_SUMMARY",
                  item["id"],
                  "voxels=", item["voxels"],
                  "dice_vs_same_atlas=", item["diceAgainstBundledAtlasLabel"],
                  "slice_range=", (min(item["nonEmptySlices"]), max(item["nonEmptySlices"]))
              )
          combined = nib.load(str(root / manifest["labelMap"]["file"]))
          assert combined.shape == (256, 256, 113)
          assert np.allclose(combined.affine, np.asarray(manifest["affineRAS"]), atol=1e-4)
          assert set(np.unique(np.asarray(combined.dataobj)).tolist()).issubset({0, 1, 2, 3, 4})
          print("FOUR_ORGAN_MASKS_VALIDATED_IN_AXIAL_CORONAL_SAGITTAL")
          PY

      - name: Upload generated mask artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctedu-experimental-major-organ-masks
          path: preview/assets/organ-predictions/
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated masks to the experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview/assets/organ-predictions
          if git diff --cached --quiet; then
            echo "Generated organ masks match the checked-out branch; no generated-asset commit is needed."
          else
            git commit -m "ci: add experimental major-organ masks [skip ci]"
            target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            pushed=0
            for attempt in 1 2 3; do
              git fetch origin "$target_branch"
              git rebase "origin/$target_branch"
              if git push origin "HEAD:refs/heads/$target_branch"; then
                pushed=1
                break
              fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep 2
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Could not update $target_branch after three fetch/rebase/push attempts."
              exit 1
            fi
          fi
