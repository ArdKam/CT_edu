name: Experimental CT-ORG held-out Segmentor evaluation

on:
  workflow_dispatch:
    inputs:
      case_set:
        description: "Use two official test cases for the smoke/pilot run, or the full official held-out test set"
        required: true
        type: choice
        options:
          - pilot-2
          - official-test-21
        default: pilot-2
      resolution:
        description: "Pinned TotalSegmentator resolution mode"
        required: true
        type: choice
        options:
          - fast
          - full
        default: fast

permissions:
  contents: read

concurrency:
  group: ctorg-heldout-segmentor-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate-ctorg:
    if: ${{ github.repository == 'ArdKam/CT_edu' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: "2"
      ITK_GLOBAL_DEFAULT_MAX_THREADS: "2"
      CTORG_CASE_SET: ${{ inputs.case_set }}
      CTORG_RESOLUTION: ${{ inputs.resolution }}
    steps:
      - name: Check out the explicitly selected non-main experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned model and evaluation dependencies
        run: |
          python -m pip install --disable-pip-version-check "numpy<2" scipy nibabel "TotalSegmentator==2.11.0"

      - name: Download official CT-ORG archives and evaluate only the held-out test split
        shell: bash
        run: |
          set -euo pipefail
          BASE="build/ctorg-validation"
          ARCHIVES="$BASE/private-archives"
          INPUT="$BASE/private-input"
          REPORTS="$BASE/reports"
          mkdir -p "$ARCHIVES" "$REPORTS"
          cleanup_private_data() {
            rm -rf "$ARCHIVES" "$INPUT"
          }
          trap cleanup_private_data EXIT

          if [[ "$CTORG_CASE_SET" == "pilot-2" ]]; then
            CASES=(0 1)
          else
            CASES=($(seq 0 20))
          fi

          # Official TCIA/CT-ORG Box shares. Source archives are not committed or uploaded.
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "https://app.box.com/s/xxtxlpa1ift5c8d084njjerxamb951gy?download=1" \
            --output "$ARCHIVES/ct-org-volumes-0-49.zip"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "https://app.box.com/s/haf06j5fy2h94re315841m7ok3n04s3k?download=1" \
            --output "$ARCHIVES/ct-org-labels-readme.zip"

          python - <<'PY'
          import zipfile
          from pathlib import Path
          for archive in Path("build/ctorg-validation/private-archives").glob("*.zip"):
              if not zipfile.is_zipfile(archive):
                  raise SystemExit(f"Downloaded file is not a ZIP archive: {archive.name}")
              with zipfile.ZipFile(archive) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"ZIP CRC failure in {archive.name}: {bad}")
          print("CTORG_SOURCE_ARCHIVES_VALID")
          PY

          python scripts/prepare_ctorg_test_subset.py \
            --volumes-zip "$ARCHIVES/ct-org-volumes-0-49.zip" \
            --labels-zip "$ARCHIVES/ct-org-labels-readme.zip" \
            --output-dir "$INPUT" \
            --cases "${CASES[@]}"

          # Release compressed source archives before model inference to preserve runner disk.
          rm -rf "$ARCHIVES"

          python scripts/evaluate_ctorg_heldout.py \
            --dataset-dir "$INPUT" \
            --output-dir "$REPORTS" \
            --cases "${CASES[@]}" \
            --resolution "$CTORG_RESOLUTION" \
            --timeout-seconds 5400

      - name: Upload metric reports and non-identifying run manifest only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctedu-ctorg-heldout-metrics-${{ inputs.case_set }}-${{ inputs.resolution }}
          path: build/ctorg-validation/reports/
          if-no-files-found: ignore
          retention-days: 14
